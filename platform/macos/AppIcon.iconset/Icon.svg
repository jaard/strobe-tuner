<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none" data-colorway="amber">
  <title>Strobel app icon</title>
  <desc>Three striped strobe bands. Colors are set by just icons from COLORWAYS in src/app/colorways.odin.</desc>
  <defs>
