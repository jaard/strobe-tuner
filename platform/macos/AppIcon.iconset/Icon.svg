    <rect id="icon-shape" x="24" y="25" width="206" height="206" rx="46"/>
    <clipPath id="icon-clip"><use href="#icon-shape"/></clipPath>
    <filter id="drop-shadow" x="14" y="15" width="226" height="226" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dy="2.5"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="inner-shadow" x="24" y="20" width="206" height="211" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feOffset in="SourceAlpha" dy="-5"/>
